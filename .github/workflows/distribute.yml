name: Distribute

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published stable release tag to distribute (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  upload-itchio:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync node version
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Require a published stable release
        id: release_metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/release.json"
          node scripts/release-distribution.mjs "$RELEASE_TAG" "$RUNNER_TEMP/release.json"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir ./release-assets \
            --pattern '*.dmg' \
            --pattern '*.AppImage' \
            --pattern '*.msi'

      - name: Install butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          VERSION: ${{ steps.release_metadata.outputs.version }}
        run: |
          ./butler push release-assets/*.dmg rakanssh/hakawati:macos --userversion "$VERSION"
          ./butler push release-assets/*.AppImage rakanssh/hakawati:linux --userversion "$VERSION"
          ./butler push release-assets/*.msi rakanssh/hakawati:windows --userversion "$VERSION"
