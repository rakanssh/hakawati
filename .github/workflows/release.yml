name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release_metadata.outputs.tag }}
      prerelease: ${{ steps.release_metadata.outputs.prerelease }}
    steps:
      - name: Require an existing tag ref
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo 'Release requires an existing tag. Use gh workflow run release.yml --ref <tag>; branch dispatch is not allowed.' >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Validate release tag, versions, and changelog
        id: release_metadata
        run: node scripts/release-validate.mjs --tag-ref

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libgtk-3-dev libasound2-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "release-tests"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend checks
        run: |
          npm run typecheck
          npm run test:run

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Generate license notices for Tauri resources
        run: npm run licenses:generate

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  release:
    needs: verify
    environment: production
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: "--target x86_64-unknown-linux-gnu"
            targets: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: "--target x86_64-pc-windows-msvc"
            targets: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Require production server configuration
        shell: bash
        env:
          VITE_HAKAWATI_SYNC_SERVER_URL: ${{ vars.VITE_HAKAWATI_SYNC_SERVER_URL }}
        run: |
          if [ -z "$VITE_HAKAWATI_SYNC_SERVER_URL" ]; then
            echo '::error::Set VITE_HAKAWATI_SYNC_SERVER_URL in the GitHub production environment variables.'
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libgtk-3-dev libasound2-dev patchelf

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "tauri-build"
          cache-on-failure: true

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Generate release notes
        id: release_notes
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: npx tsx scripts/extract-latest-release-notes.ts

      - name: Import Apple Developer Certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -eo pipefail
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Capture Signing Identity
        if: matrix.platform == 'macos-latest'
        run: |
          set -eo pipefail
          CERT_ID=$(security find-identity -v -p codesigning build.keychain | awk -F '"' '/Developer ID Application|Apple Development/{print $2; exit}')
          if [ -z "$CERT_ID" ]; then
            echo "Unable to find a valid signing identity" >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> $GITHUB_ENV

      - name: Build the app
        uses: tauri-apps/tauri-action@v0

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_HAKAWATI_SYNC_SERVER_URL: ${{ vars.VITE_HAKAWATI_SYNC_SERVER_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ needs.verify.outputs.tag }}
          releaseName: "Hakawati ${{ needs.verify.outputs.tag }}"
          releaseBody: ${{ steps.release_notes.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          args: "${{ matrix.args }} -- --locked"
