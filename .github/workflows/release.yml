name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release_metadata.outputs.tag }}
      prerelease: ${{ steps.release_metadata.outputs.prerelease }}
    steps:
      - name: Require an existing tag ref
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo 'Release requires an existing tag. Use gh workflow run release.yml --ref <tag>; branch dispatch is not allowed.' >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Validate release tag, versions, and changelog
        id: release_metadata
        run: node scripts/release-validate.mjs --tag-ref

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libgtk-3-dev libasound2-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "release-tests"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend checks
        run: |
          npm run typecheck
          npm run test:run

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Generate license notices for Tauri resources
        run: npm run licenses:generate

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  release:
    needs: verify
    environment: production
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: "--target x86_64-unknown-linux-gnu"
            targets: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: "--target x86_64-pc-windows-msvc"
            targets: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Require production server configuration
        shell: bash
        env:
          VITE_HAKAWATI_SYNC_SERVER_URL: ${{ vars.VITE_HAKAWATI_SYNC_SERVER_URL }}
        run: |
          if [ -z "$VITE_HAKAWATI_SYNC_SERVER_URL" ]; then
            echo '::error::Set VITE_HAKAWATI_SYNC_SERVER_URL in the GitHub production environment variables.'
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libgtk-3-dev libasound2-dev patchelf

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "tauri-build"
          cache-on-failure: true

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Generate release notes
        id: release_notes
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: npx tsx scripts/extract-latest-release-notes.ts

      - name: Import Apple Developer Certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -eo pipefail
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Capture Signing Identity
        if: matrix.platform == 'macos-latest'
        run: |
          set -eo pipefail
          CERT_ID=$(security find-identity -v -p codesigning build.keychain | awk -F '"' '/Developer ID Application|Apple Development/{print $2; exit}')
          if [ -z "$CERT_ID" ]; then
            echo "Unable to find a valid signing identity" >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> $GITHUB_ENV

      - name: Build the app
        uses: tauri-apps/tauri-action@v0

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_HAKAWATI_SYNC_SERVER_URL: ${{ vars.VITE_HAKAWATI_SYNC_SERVER_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ needs.verify.outputs.tag }}
          releaseName: "Hakawati ${{ needs.verify.outputs.tag }}"
          releaseBody: ${{ steps.release_notes.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          args: "${{ matrix.args }} -- --locked"

  android:
    # Runs after the desktop builds so their draft release exists to attach to.
    needs: [verify, release]
    environment: production
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: "30.0.16248370"
      ANDROID_TARGETS: "--target aarch64 --target armv7 --target x86_64"
    steps:
      - name: Require production configuration and signing secrets
        env:
          VITE_HAKAWATI_SYNC_SERVER_URL: ${{ vars.VITE_HAKAWATI_SYNC_SERVER_URL }}
          HAKAWATI_ANDROID_KEYSTORE_BASE64: ${{ secrets.HAKAWATI_ANDROID_KEYSTORE_BASE64 }}
          HAKAWATI_KEYSTORE_PASSWORD: ${{ secrets.HAKAWATI_KEYSTORE_PASSWORD }}
          HAKAWATI_KEY_ALIAS: ${{ secrets.HAKAWATI_KEY_ALIAS }}
          HAKAWATI_KEY_PASSWORD: ${{ secrets.HAKAWATI_KEY_PASSWORD }}
        run: |
          missing=0
          for name in VITE_HAKAWATI_SYNC_SERVER_URL HAKAWATI_ANDROID_KEYSTORE_BASE64 HAKAWATI_KEYSTORE_PASSWORD HAKAWATI_KEY_ALIAS HAKAWATI_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Set $name in the GitHub production environment."
              missing=1
            fi
          done
          exit $missing

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Java setup
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Android SDK setup
        uses: android-actions/setup-android@v3

      - name: Install the Android NDK
        run: |
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "tauri-android"
          cache-on-failure: true

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Write the upload keystore
        env:
          HAKAWATI_ANDROID_KEYSTORE_BASE64: ${{ secrets.HAKAWATI_ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$HAKAWATI_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "HAKAWATI_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build the Android app
        env:
          VITE_HAKAWATI_SYNC_SERVER_URL: ${{ vars.VITE_HAKAWATI_SYNC_SERVER_URL }}
          HAKAWATI_KEYSTORE_PASSWORD: ${{ secrets.HAKAWATI_KEYSTORE_PASSWORD }}
          HAKAWATI_KEY_ALIAS: ${{ secrets.HAKAWATI_KEY_ALIAS }}
          HAKAWATI_KEY_PASSWORD: ${{ secrets.HAKAWATI_KEY_PASSWORD }}
        run: |
          # One bundle for Google Play, which serves each device its own ABI,
          # and one APK per ABI for installing directly.
          npx tauri android build --ci --aab $ANDROID_TARGETS
          npx tauri android build --ci --apk --split-per-abi $ANDROID_TARGETS

      - name: Attach the Android builds to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -eo pipefail
          mkdir -p android-release
          version="${RELEASE_TAG#v}"
          find src-tauri/gen/android/app/build/outputs \( -name '*.apk' -o -name '*.aab' \) -print0 |
            while IFS= read -r -d '' file; do
              name=$(basename "$file")
              case "$name" in
                *unsigned*)
                  echo "::error::$name is unsigned; check the keystore secrets."
                  exit 1
                  ;;
              esac
              abi=${name#app-}
              abi=${abi%-release.*}
              cp "$file" "android-release/Hakawati_${version}_android_${abi}.${name##*.}"
            done
          ls -l android-release
          gh release upload "$RELEASE_TAG" android-release/* --clobber

  ios:
    # Uploads to TestFlight, where testers and App Review pick the build up. An
    # IPA can't be installed from GitHub, so nothing is attached to the release.
    needs: verify
    environment: production
    runs-on: macos-latest
    steps:
      - name: Require production configuration and App Store Connect access
        env:
          VITE_HAKAWATI_SYNC_SERVER_URL: ${{ vars.VITE_HAKAWATI_SYNC_SERVER_URL }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          missing=0
          for name in VITE_HAKAWATI_SYNC_SERVER_URL APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY_ID APPLE_API_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Set $name in the GitHub production environment."
              missing=1
            fi
          done
          exit $missing

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-apple-ios"
          # swift-rs needs llvm-objcopy to keep the Swift plugins' entry points
          # visible on Xcode 27, or the release build fails to link them.
          components: "llvm-tools"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "tauri-ios"
          cache-on-failure: true

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      # One App Store Connect API key both signs (Xcode creates the distribution
      # certificate and profile) and uploads.
      - name: Write the App Store Connect key
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_dir/AuthKey_$APPLE_API_KEY_ID.p8"
          echo "APPLE_API_KEY_PATH=$key_dir/AuthKey_$APPLE_API_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Build the iOS app
        env:
          VITE_HAKAWATI_SYNC_SERVER_URL: ${{ vars.VITE_HAKAWATI_SYNC_SERVER_URL }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          # TestFlight refuses a build number it has seen, so each run and
          # re-run gets its own.
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          config=$(printf '{"bundle":{"iOS":{"developmentTeam":"%s","bundleVersion":"%s"}}}' "$APPLE_TEAM_ID" "$BUILD_NUMBER")
          npx tauri ios build --ci --export-method app-store-connect --config "$config"

      - name: Upload to TestFlight
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -eo pipefail
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' | head -n 1)
          if [ -z "$ipa" ]; then
            echo "::error::The iOS build produced no IPA."
            exit 1
          fi
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
